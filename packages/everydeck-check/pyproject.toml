[project]
name = "everydeck-check"
version = "0.3.11"
description = "everydeck check for app repositories: validate the app map, detect drift of everydeck calls, re-anchor places, publish"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["jsonschema[format]>=4.26"]

[project.urls]
Homepage = "https://everydeck.ai"
Repository = "https://github.com/everydeck/everydeck"

[project.optional-dependencies]
test = ["pytest>=8", "build>=1.2"]

[project.scripts]
everydeck-check = "everydeck_check.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["everydeck_check*"]

[tool.setuptools.package-data]
everydeck_check = ["schemas/*.json", "rules/*.mjs"]
