[project]
name = "everydeck"
version = "0.5.4"
description = "everydeck Python SDK: bounded buffer, background sender, flush on shutdown, reported data gaps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://everydeck.ai"
Repository = "https://github.com/everydeck/everydeck"

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema[format]>=4.26", "build>=1.2", "fastapi>=0.110", "httpx>=0.27", "openai>=1.40", "anthropic>=0.40"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["everydeck*"]
